name: CI Pipeline

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    test:
        name: Lint, Test, and Build
        runs-on: ubuntu-latest

        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_DB: ci_db
              POSTGRES_USER: ci_user
              POSTGRES_PASSWORD: ci_password
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5

          redis:
            image: redis:7
            ports:
              - 6379:6379


        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Upgrade pip
              run: |
                python -m pip install --upgrade pip

            - name: Install Dependencies
              run: |
                pip install -r requirements/dev.txt

            - name: Run Ruff
              run: |
                ruff check .

            - name: Run Black
              run: |
                black --check .

            - name: Run isort
              run: |
                isort . --check-only

            - name: Run Tests
              env:
                SECRET_KEY: "ci-secret-key"
                DEBUG: "False"

                DB_ENGINE: "django.db.backends.postgresql"
                DB_NAME: "ci_db"
                DB_USER: "ci_user"
                DB_PASSWORD: "ci_password"
                DB_HOST: "localhost"
                DB_PORT: "5432"

                REDIS_URL: "redis://localhost:6379/0"

                STRIPE_SECRET_KEY: "sk_test_ci_dummy_key"
                STRIPE_PUBLISHABLE_KEY: "pk_test_ci_dummy_key"
                STRIPE_WEBHOOK_SECRET:  "whsec_ci_dummy_key"


              run: |
                pytest

            - name: Build Docker Image
              run: |
                docker build -t saas-biling-platform .
