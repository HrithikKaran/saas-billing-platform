name: CI Pipeline

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    test:
        name: Lint, Test, and Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Upgrage pip
              run: |
                python -m pip install --upgrade pip

            - name: Install Dependencies
              run: |
                pip install -r requirements/dev.txt

            - name: Run Ruff
              run: |
                ruff check .

            - name: Run Black
              run: |
                black --check .

            - name: Run isort
              run: |
                isort . --check-only

            - name: Run Tests
              run: |
                pytest

            - name: Build Docker Image
              run: |
                docker build -t saas-biling-platform .
